<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Time in Different Countries</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Live Time in Different Countries By Young Rich Carter</h1>

        <div id="times">
            <!-- Times for various countries will be displayed here -->
            <div class="time-display" id="uk-time">
                <h2>United Kingdom (GMT)</h2>
                <div class="time" id="uk"></div>
            </div>
            <div class="time-display" id="us-time">
                <h2>United States (New York)</h2>
                <div class="time" id="us"></div>
            </div>
            <div class="time-display" id="india-time">
                <h2>India</h2>
                <div class="time" id="india"></div>
            </div>
            <div class="time-display" id="japan-time">
                <h2>Japan</h2>
                <div class="time" id="japan"></div>
            </div>
            <div class="time-display" id="germany-time">
                <h2>Germany</h2>
                <div class="time" id="germany"></div>
            </div>
            <div class="time-display" id="china-time">
                <h2>China</h2>
                <div class="time" id="china"></div>
            </div>
            <div class="time-display" id="cairo-time">
                <h2>Egypt</h2>
                <div class="time" id="cairo"></div>
            </div>
            <div class="time-display" id="australia-time">
                <h2>Australia</h2>
                <div class="time" id="australia"></div>
            </div>
            <div class="time-display" id="kigali-time">
                <h2>Rwanda</h2>
                <div class="time" id="kigali"></div>
            </div>
            <div class="time-display" id="los-angeles-time">
                <h2>America/Honolulu</h2>
                <div class="time" id="honolulu"></div>
            </div>
            <div class="time-display" id="accra-time">
                <h2>Ghana</h2>
                <div class="time" id="accra"></div>
            </div>
            <div class="time-display" id="paris-time">
                <h2>France</h2>
                <div class="time" id="paris"></div>
            </div>
            <div class="time-display" id="moscow-time">
                <h2>Russia</h2>
                <div class="time" id="moscow"></div>
            </div>
        </div>

    </div>

    <script src="./js/main.js"></script>
</body>
</html>
